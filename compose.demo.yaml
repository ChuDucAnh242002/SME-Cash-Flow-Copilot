services:
  app:
    image: sme-cashflow-recruiter-demo:local
    ports: !override
      - "127.0.0.1:8083:8080"
    environment:
      APP_USER: developer
      APP_PASSWORD: local-demo-password
      POSTGRES_PASSWORD: local-database-password
      BANK_MODE: demo
      NORDEA_CLIENT_ID: ""
      NORDEA_ACCOUNT_ID: ""
      NORDEA_CLIENT_SECRET_FILE: ""
      NORDEA_ACCESS_TOKEN_FILE: ""
      NORDEA_PRIVATE_KEY_FILE: ""
    volumes: !reset []
  postgres:
    environment:
      POSTGRES_PASSWORD: local-database-password

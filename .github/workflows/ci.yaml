name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  devbox-smoke:
    name: Devbox workflow smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: jetify-com/devbox-install-action@734088efddca47cf44ff8a09289c6d0e51b73218 # v0.12.0
        with:
          devbox-version: 0.22.0
          enable-cache: 'false'
          disable-nix-access-token: 'true'
      - run: |
          devbox run doctor
          devbox run setup
          devbox run test
          git diff --exit-code -- devbox.json devbox.lock
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build && npm test
        working-directory: frontend
      - run: mvn -B verify
        working-directory: backend
      - name: Upload Maven test reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maven-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7
      - run: docker compose config --quiet
      - run: docker compose -p sme-cashflow-statement-ci -f compose.yaml -f compose.statement.yaml config --quiet
      - run: bash -n scripts/k8s-db.sh scripts/ci-compose.sh && node --test scripts/*.test.mjs
      - run: kubectl kustomize deploy/k8s > /tmp/cashflow-rendered.yaml
      - run: kubectl kustomize deploy/k8s-demo > /tmp/cashflow-demo-rendered.yaml
      - run: docker compose up --build -d --wait
      - run: node scripts/smoke.mjs
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
      - run: docker compose -p sme-cashflow-statement-ci -f compose.yaml -f compose.statement.yaml up -d --wait
      - run: STATEMENT_E2E=1 APP_URL=http://127.0.0.1:8081 npm run test:e2e
        working-directory: frontend
      - run: |
          docker compose down
          docker compose -p sme-cashflow-statement-ci -f compose.yaml -f compose.statement.yaml down
      - run: node scripts/demo.mjs up && node scripts/demo.mjs verify
      - run: node scripts/demo.mjs stop && node scripts/demo.mjs up && node scripts/demo.mjs verify
      - run: node scripts/demo.mjs reset --confirm-reset && node scripts/demo.mjs verify
      - run: node scripts/demo.mjs check-recovery --confirm-outage
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results
      - run: docker compose down
        if: always()
      - run: docker compose -p sme-cashflow-statement-ci -f compose.yaml -f compose.statement.yaml down
        if: always()
      - run: node scripts/demo.mjs stop
        if: always()

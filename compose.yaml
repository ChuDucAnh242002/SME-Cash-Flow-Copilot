name: sme-cashflow
services:
  app:
    build: .
    image: sme-cashflow-copilot:0.1.0
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      APP_USER: ${APP_USER:-developer}
      APP_PASSWORD: ${APP_PASSWORD:-local-demo-password}
      DATABASE_URL: jdbc:postgresql://postgres:5432/copilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-database-password}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BANK_MODE: ${BANK_MODE:-demo}
      NORDEA_CLIENT_ID: ${NORDEA_CLIENT_ID:-}
      NORDEA_ACCOUNT_ID: ${NORDEA_ACCOUNT_ID:-}
      NORDEA_FROM_DATE: ${NORDEA_FROM_DATE:-2026-01-01}
      NORDEA_CLIENT_SECRET_FILE: /run/nordea/client-secret
      NORDEA_ACCESS_TOKEN_FILE: /run/nordea/access-token
      NORDEA_PRIVATE_KEY_FILE: ${NORDEA_PRIVATE_KEY_FILE:-}
    volumes:
      - ./secrets:/run/nordea:ro
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: copilot
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-database-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilot"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped
volumes:
  postgres-data:
  kafka-data:
